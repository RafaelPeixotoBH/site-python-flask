<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Meu Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow border-0">
                    <div class="card-header bg-success text-white text-center">
                        <h2 class="h4 mb-0">Nova Conta</h2>
                    </div>
                    <div class="card-body p-4">
                        <form action="{{ url_for('registrar') }}" method="POST">
                            <div class="mb-3">
                                <label class="form-label">Nome de Usuário</label>
                                <input type="text" name="username" class="form-control" placeholder="Ex: joao_silva" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">E-mail</label>
                                <input type="email" name="email" class="form-control" placeholder="seu@email.com" required>
                                <div class="form-text">Use um e-mail válido para recuperação de senha.</div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Senha</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success">Cadastrar</button>
                                <a href="{{ url_for('login') }}" class="btn btn-link text-decoration-none">Já tem conta? Faça Login</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
